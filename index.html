<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Hub - Official Platform</title>
    <meta name="description" content="JB Hub - Interactive arcade, cloud notes, and secure user hub.">
    <meta name="keywords" content="JB Hub, JB YT GAMER, Cloud Hub, Cyber Arcade">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; overflow-x: hidden; background: #050505; color: white; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
        .glass { background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .active-tab { border-bottom: 3px solid #a855f7; color: #a855f7; font-weight: bold; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.5); border-radius: 3px; }
        .touch-btn { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Auth Container -->
    <div id="auth-container" class="flex-grow flex items-center justify-center p-4">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <h1 id="auth-title" class="text-3xl font-extrabold text-center mb-6 text-purple-400">JB Hub</h1>
            
            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="login-username" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 font-bold py-2 rounded-lg transition duration-200">Sign In</button>
                <p class="text-xs text-center text-gray-400 mt-2">Don't have an account? <a href="#" onclick="toggleAuthMode(true)" class="text-purple-400 underline">Register</a></p>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium mb-1">Choose Username</label>
                    <input type="text" id="reg-username" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Choose Password</label>
                    <input type="password" id="reg-password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 font-bold py-2 rounded-lg transition duration-200">Create Account</button>
                <p class="text-xs text-center text-gray-400 mt-2">Already have an account? <a href="#" onclick="toggleAuthMode(false)" class="text-purple-400 underline">Log In</a></p>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="main-dashboard" class="hidden flex-grow flex flex-col">
        <!-- Navigation -->
        <nav class="glass mx-4 mt-4 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-cubes text-2xl text-purple-400"></i>
                <span class="text-xl font-bold tracking-wide">JB Hub</span>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="switchTab('arcade')" id="tab-arcade" class="px-3 py-1 active-tab"><i class="fa-solid fa-gamepad mr-2"></i>Arcade</button>
                <button onclick="switchTab('notes')" id="tab-notes" class="px-3 py-1 text-gray-400 hover:text-white"><i class="fa-solid fa-note-sticky mr-2"></i>Notes</button>
                <button onclick="switchTab('profile')" id="tab-profile" class="px-3 py-1 text-gray-400 hover:text-white"><i class="fa-solid fa-user-gear mr-2"></i>Profile</button>
                <button onclick="switchTab('admin')" id="tab-admin" class="px-3 py-1 text-gray-400 hover:text-white hidden"><i class="fa-solid fa-shield-halved mr-2"></i>Admin</button>
                <button onclick="logout()" class="bg-red-600/80 hover:bg-red-700 text-sm px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-right-from-bracket mr-1"></i>Logout</button>
            </div>
        </nav>

        <!-- View Sections -->
        <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full">
            
            <!-- SECTION: Arcade Game & Leaderboard -->
            <section id="section-arcade" class="grid md:grid-cols-3 gap-6">
                <div class="md:col-span-2 glass p-4 rounded-xl flex flex-col items-center">
                    <h2 class="text-xl font-bold mb-2">Cyber Arcade</h2>
                    <canvas id="gameCanvas" width="400" height="400" class="bg-black border border-purple-500/30 rounded-lg max-w-full"></canvas>
                    
                    <!-- Keyboard Controls Notice (Desktop) -->
                    <p id="pc-controls-msg" class="text-xs text-gray-400 mt-2 hidden">Controls: Use <b>Arrow Keys</b> or <b>WASD</b> to move.</p>
                    
                    <!-- Touch Controls (Mobile) -->
                    <div id="mobile-controls" class="mt-4 grid grid-cols-3 gap-2 w-48 text-center hidden">
                        <div></div>
                        <button class="touch-btn bg-purple-800 p-3 rounded-lg text-lg active:bg-purple-600" onclick="handleMobileMove('UP')">▲</button>
                        <div></div>
                        <button class="touch-btn bg-purple-800 p-3 rounded-lg text-lg active:bg-purple-600" onclick="handleMobileMove('LEFT')">◄</button>
                        <button class="touch-btn bg-purple-800 p-3 rounded-lg text-lg active:bg-purple-600" onclick="handleMobileMove('DOWN')">▼</button>
                        <button class="touch-btn bg-purple-800 p-3 rounded-lg text-lg active:bg-purple-600" onclick="handleMobileMove('RIGHT')">►</button>
                    </div>
                </div>

                <!-- Leaderboard -->
                <div class="glass p-4 rounded-xl">
                    <h2 class="text-xl font-bold mb-4 flex items-center justify-between">
                        <span><i class="fa-solid fa-trophy text-yellow-400 mr-2"></i>Leaderboard</span>
                    </h2>
                    <div id="leaderboard-list" class="space-y-2 text-sm max-h-[380px] overflow-y-auto">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </section>

            <!-- SECTION: Notes -->
            <section id="section-notes" class="hidden glass p-6 rounded-xl space-y-4">
                <h2 class="text-2xl font-bold">Cloud Notes</h2>
                <div class="flex gap-2">
                    <input type="text" id="note-input" placeholder="Write a note..." class="flex-grow bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500">
                    <button onclick="saveNote()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-bold">Save</button>
                </div>
                <div id="notes-container" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4 mt-4">
                    <!-- Dynamically populated -->
                </div>
            </section>

            <!-- SECTION: User Profile Settings -->
            <section id="section-profile" class="hidden glass p-6 rounded-xl max-w-lg mx-auto">
                <h2 class="text-2xl font-bold mb-4">Profile Settings</h2>
                <form onsubmit="updateProfile(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400">Current Username</label>
                        <input type="text" id="prof-username" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 mt-1">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400">Old Password (Required to make changes)</label>
                        <input type="password" id="prof-old-pass" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 mt-1">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400">New Password (Leave blank to keep current)</label>
                        <input type="password" id="prof-new-pass" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 mt-1">
                    </div>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-2 rounded-lg font-bold">Update Profile</button>
                </form>
            </section>

            <!-- SECTION: Admin Panel -->
            <section id="section-admin" class="hidden glass p-6 rounded-xl">
                <h2 class="text-2xl font-bold mb-4 text-purple-400"><i class="fa-solid fa-user-shield mr-2"></i>Admin Dashboard</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="border-b border-gray-700 text-gray-400">
                                <th class="p-2">User Key</th>
                                <th class="p-2">Username</th>
                                <th class="p-2">Password</th>
                                <th class="p-2">Role</th>
                                <th class="p-2">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-user-list">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDz9tvaSzzsp0mMUY0-oIaBR0hSPObPDdQ",
            authDomain: "jb-hub-93d7a.firebaseapp.com",
            databaseURL: "https://jb-hub-93d7a-default-rtdb.firebaseio.com",
            projectId: "jb-hub-93d7a",
            storageBucket: "jb-hub-93d7a.firebasestorage.app",
            messagingSenderId: "110994910947",
            appId: "1:110994910947:web:264def00932f82407b9fd6",
            measurementId: "G-7WHNLQ2P9Q"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let editingNoteId = null;

        // Device Control Detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        window.addEventListener('DOMContentLoaded', () => {
            if (isMobile) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            } else {
                document.getElementById('pc-controls-msg').classList.remove('hidden');
            }
        });

        // Authentication Handlers
        function toggleAuthMode(showRegister) {
            document.getElementById('login-form').classList.toggle('hidden', showRegister);
            document.getElementById('register-form').classList.toggle('hidden', !showRegister);
            document.getElementById('auth-title').innerText = showRegister ? 'Register - JB Hub' : 'JB Hub';
        }

        function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('reg-username').value.trim();
            const p = document.getElementById('reg-password').value;
            
            db.ref('users').once('value', snapshot => {
                const users = snapshot.val() || {};
                const exists = Object.values(users).some(user => user.username === u);
                
                if (exists) {
                    alert('Username already taken!');
                    return;
                }

                const isFirst = Object.keys(users).length === 0;
                const newUserRef = db.ref('users').push();
                const userData = { username: u, password: p, isAdmin: isFirst };
                
                newUserRef.set(userData, err => {
                    if (!err) {
                        alert('Account created! Please log in.');
                        toggleAuthMode(false);
                    }
                });
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;

            db.ref('users').once('value', snapshot => {
                const users = snapshot.val() || {};
                let foundKey = null;
                let foundData = null;

                Object.entries(users).forEach(([key, val]) => {
                    if (val.username === u && val.password === p) {
                        foundKey = key;
                        foundData = val;
                    }
                });

                if (foundData) {
                    currentUser = { key: foundKey, ...foundData };
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    document.getElementById('prof-username').value = currentUser.username;
                    
                    if (currentUser.isAdmin) {
                        document.getElementById('tab-admin').classList.remove('hidden');
                        loadAdminUsers();
                    }
                    
                    loadNotes();
                    loadLeaderboard();
                    initGame();
                } else {
                    alert('Invalid credentials!');
                }
            });
        }

        function logout() {
            currentUser = null;
            location.reload();
        }

        // Tab Navigation
        function switchTab(tab) {
            ['arcade', 'notes', 'profile', 'admin'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`)?.classList.remove('active-tab');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`)?.classList.add('active-tab');
        }

        // Profile Editing
        function updateProfile(e) {
            e.preventDefault();
            const newU = document.getElementById('prof-username').value.trim();
            const oldP = document.getElementById('prof-old-pass').value;
            const newP = document.getElementById('prof-new-pass').value;

            if (oldP !== currentUser.password) {
                alert('Old password incorrect!');
                return;
            }

            const oldU = currentUser.username;
            const updates = { username: newU };
            if (newP.trim() !== "") updates.password = newP;

            db.ref(`users/${currentUser.key}`).update(updates, err => {
                if (!err) {
                    currentUser.username = newU;
                    if (newP.trim() !== "") currentUser.password = newP;
                    
                    // Update leaderboard username mapping if changed
                    if (oldU !== newU) {
                        db.ref('leaderboard').once('value', snap => {
                            const scores = snap.val() || {};
                            Object.entries(scores).forEach(([key, item]) => {
                                if (item.username === oldU) {
                                    db.ref(`leaderboard/${key}`).update({ username: newU });
                                }
                            });
                        });
                    }
                    
                    alert('Profile updated successfully!');
                    document.getElementById('prof-old-pass').value = '';
                    document.getElementById('prof-new-pass').value = '';
                }
            });
        }

        // Notes Feature with Timestamp & Editing
        function saveNote() {
            const input = document.getElementById('note-input');
            const txt = input.value.trim();
            if (!txt) return;

            const dateStr = new Date().toLocaleString();

            if (editingNoteId) {
                db.ref(`notes/${editingNoteId}`).update({
                    text: txt,
                    editedAt: dateStr
                });
                editingNoteId = null;
            } else {
                db.ref('notes').push({
                    user: currentUser.username,
                    text: txt,
                    createdAt: dateStr,
                    editedAt: dateStr
                });
            }
            input.value = '';
        }

        function loadNotes() {
            db.ref('notes').on('value', snap => {
                const container = document.getElementById('notes-container');
                container.innerHTML = '';
                const notes = snap.val() || {};

                Object.entries(notes).forEach(([key, note]) => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-900 border border-gray-800 p-4 rounded-lg flex flex-col justify-between";
                    
                    let editBtn = note.user === currentUser.username || currentUser.isAdmin 
                        ? `<button onclick="editNote('${key}', '${escape(note.text)}')" class="text-xs text-purple-400 hover:underline">Edit</button>` 
                        : '';

                    card.innerHTML = `
                        <p class="text-gray-200 mb-2">${note.text}</p>
                        <div class="text-xs text-gray-500 border-t border-gray-800 pt-2 flex justify-between items-center">
                            <span>By: ${note.user}</span>
                            <span>${note.editedAt || note.createdAt}</span>
                        </div>
                        <div class="mt-2 flex justify-end">${editBtn}</div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function editNote(id, text) {
            editingNoteId = id;
            document.getElementById('note-input').value = unescape(text);
            document.getElementById('note-input').focus();
        }

        // Admin Management
        function loadAdminUsers() {
            db.ref('users').on('value', snap => {
                const tbody = document.getElementById('admin-user-list');
                tbody.innerHTML = '';
                const users = snap.val() || {};

                Object.entries(users).forEach(([key, u]) => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-gray-800";
                    tr.innerHTML = `
                        <td class="p-2 text-xs text-gray-500">${key}</td>
                        <td class="p-2"><input type="text" id="adm-u-${key}" value="${u.username}" class="bg-gray-800 px-2 py-1 rounded w-32"></td>
                        <td class="p-2"><input type="text" id="adm-p-${key}" value="${u.password}" class="bg-gray-800 px-2 py-1 rounded w-32"></td>
                        <td class="p-2">${u.isAdmin ? '<span class="text-purple-400">Admin</span>' : 'User'}</td>
                        <td class="p-2">
                            <button onclick="adminSaveUser('${key}')" class="bg-purple-600 px-2 py-1 rounded text-xs">Save</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        function adminSaveUser(key) {
            const newU = document.getElementById(`adm-u-${key}`).value.trim();
            const newP = document.getElementById(`adm-p-${key}`).value.trim();
            db.ref(`users/${key}`).update({ username: newU, password: newP }, () => alert('User updated!'));
        }

        // Leaderboard Controls & Game Logic
        function loadLeaderboard() {
            db.ref('leaderboard').orderByChild('score').on('value', snap => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';
                let items = [];
                snap.forEach(child => {
                    items.push({ id: child.key, ...child.val() });
                });
                items.reverse();

                items.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = "flex justify-between items-center p-2 bg-gray-900 rounded border border-gray-800";
                    
                    let adminControls = currentUser.isAdmin ? `
                        <button onclick="editScore('${item.id}', ${item.score})" class="text-xs text-yellow-400 px-1">✏️</button>
                        <button onclick="deleteScore('${item.id}')" class="text-xs text-red-400 px-1">❌</button>
                    ` : '';

                    row.innerHTML = `
                        <span>#${index+1} <b>${item.username}</b></span>
                        <div class="flex items-center gap-2">
                            <span class="text-purple-400 font-bold">${item.score} pts</span>
                            ${adminControls}
                        </div>
                    `;
                    list.appendChild(row);
                });
            });
        }

        function editScore(id, currentScore) {
            const newScore = prompt("Enter new score:", currentScore);
            if (newScore !== null) {
                db.ref(`leaderboard/${id}`).update({ score: parseInt(newScore) });
            }
        }

        function deleteScore(id) {
            if (confirm("Delete leaderboard entry?")) {
                db.ref(`leaderboard/${id}`).remove();
            }
        }

        // Snake Arcade Game Implementation
        let canvas, ctx, gameInterval;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1, dy = 0;
        let score = 0;

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            document.addEventListener('keydown', handleKeyInput);
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 120);
        }

        function handleKeyInput(e) {
            if (e.key === 'ArrowUp' || e.key === 'w') { if (dy === 0) { dx = 0; dy = -1; } }
            if (e.key === 'ArrowDown' || e.key === 's') { if (dy === 0) { dx = 0; dy = 1; } }
            if (e.key === 'ArrowLeft' || e.key === 'a') { if (dx === 0) { dx = -1; dy = 0; } }
            if (e.key === 'ArrowRight' || e.key === 'd') { if (dx === 0) { dx = 1; dy = 0; } }
        }

        function handleMobileMove(dir) {
            if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
            if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
        }

        function gameLoop() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            // Wall Collision Check
            if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                return gameOver();
            }

            snake.unshift(head);

            // Food Check
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) };
            } else {
                snake.pop();
            }

            // Draw Background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            ctx.fillStyle = '#a855f7';
            snake.forEach(part => ctx.fillRect(part.x * 20, part.y * 20, 18, 18));

            // Draw Food
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(food.x * 20, food.y * 20, 18, 18);
        }

        function gameOver() {
            if (score > 0) {
                db.ref('leaderboard').push({
                    username: currentUser.username,
                    score: score
                });
            }
            alert(`Game Over! Final Score: ${score}`);
            snake = [{ x: 10, y: 10 }];
            dx = 1; dy = 0;
            score = 0;
        }
    </script>
</body>
</html>
