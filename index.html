<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Hub</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    input, button { padding: 8px; margin: 5px 0; display: block; }
  </style>
</head>
<body>

  <h1>JB Hub Database Test</h1>
  
  <input type="text" id="username" placeholder="Enter Username">
  <input type="number" id="score" placeholder="Enter Score">
  <button id="saveBtn">Save to Database</button>

  <p id="status"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDz9tvaSzzsp0mMUY0-oIaBR0hSPObPDdQ",
      authDomain: "jb-hub-93d7a.firebaseapp.com",
      projectId: "jb-hub-93d7a",
      storageBucket: "jb-hub-93d7a.firebasestorage.app",
      messagingSenderId: "110994910947",
      appId: "1:110994910947:web:264def00932f82407b9fd6",
      measurementId: "G-7WHNLQ2P9Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const name = document.getElementById("username").value;
      const userScore = document.getElementById("score").value;
      const statusText = document.getElementById("status");

      if(!name || !userScore) {
        statusText.innerText = "Please fill in both fields!";
        return;
      }

      try {
        await setDoc(doc(db, "scores", name), {
          username: name,
          score: Number(userScore),
          createdAt: new Date()
        });
        statusText.innerText = "Data saved successfully to Firestore!";
      } catch (error) {
        console.error("Error saving data: ", error);
        statusText.innerText = "Error: " + error.message;
      }
    });
  </script>

</body>
</html>
